services:
  db:
    image: postgres:16-alpine  # ← Cambiar imagen
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seguimiento_proyectos_de_grado
    volumes:
      - db_data:/var/lib/postgresql/data  # ← Cambiar ruta
    ports:
      - "5432:5432"  # ← Cambiar puerto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]  # ← Cambiar comando
      timeout: 5s
      retries: 10
      interval: 5s
      start_period: 30s

  api:
    build: ./api_seguimiento_proyectos
    container_name: api_seguimiento
    restart: always
    env_file:
      - ./api_seguimiento_proyectos/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  front:
    build: ./front_seguimiento_proyectos
    container_name: front_seguimiento
    restart: always
    env_file:
      - ./front_seguimiento_proyectos/.env.local
    depends_on:
      - api
    ports:
      - "3001:3001"

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    depends_on:
      - front
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

volumes:
  db_data: