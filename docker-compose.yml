version: "3.9"
services:
  db:
    image: mysql:8
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: seguimiento_proyectos_de_grado
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  api:
    build: ./api_seguimiento_proyectos
    container_name: api_seguimiento
    restart: always
    env_file:
      - ./api_seguimiento_proyectos/.env
    depends_on:
      - db
    ports:
      - "3000:3000"

  front:
    build: ./front_seguimiento_proyectos
    container_name: front_seguimiento
    restart: always
    env_file:
      - ./front_seguimiento_proyectos/.env.local
    depends_on:
      - api
    ports:
      - "3001:3001"

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    depends_on:
      - front
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

volumes:
  db_data:
