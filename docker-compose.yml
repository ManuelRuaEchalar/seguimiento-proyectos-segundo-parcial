services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: seguimiento_proyectos_de_grado
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      timeout: 5s
      retries: 10
      interval: 5s
      start_period: 30s
    networks:
      - app-network

  api:
    build: ./api_seguimiento_proyectos
    container_name: api_seguimiento
    restart: always
    env_file:
      - ./api_seguimiento_proyectos/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads
    networks:
      - app-network

  front:
    build: ./front_seguimiento_proyectos
    container_name: front_seguimiento
    restart: always
    env_file:
      - ./front_seguimiento_proyectos/.env.local
    depends_on:
      - api
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: always
    depends_on:
      - front
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - uploads_data:/app/public/uploads:ro
      - nginx_cache:/var/cache/nginx
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    command: >
      sh -c " mkdir -p /var/cache/nginx && chown nginx:nginx /var/cache/nginx && nginx -g 'daemon off;' "
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  db_data:
  uploads_data:
  nginx_cache:
  certbot_conf:
  certbot_www:

networks:
  app-network:
    driver: bridge