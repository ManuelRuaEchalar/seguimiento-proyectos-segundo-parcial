services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}  # Mejor usar variable
      POSTGRES_DB: seguimiento_proyectos_de_grado
    volumes:
      - db_data:/var/lib/postgresql/data
    # ⚠️ NO exponer puerto en producción
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      timeout: 5s
      retries: 10
      interval: 5s
      start_period: 30s
    networks:
      - app-network

  api:
    build: ./api_seguimiento_proyectos
    container_name: api_seguimiento
    restart: always
    env_file:
      - ./api_seguimiento_proyectos/.env
    depends_on:
      db:
        condition: service_healthy
    # ⚠️ NO exponer puerto directamente
    # ports:
    #   - "3000:3000"
    networks:
      - app-network

  front:
    build: ./front_seguimiento_proyectos
    container_name: front_seguimiento
    restart: always
    env_file:
      - ./front_seguimiento_proyectos/.env.local
    depends_on:
      - api
    # ⚠️ NO exponer puerto directamente
    # ports:
    #   - "3001:3001"
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: always
    depends_on:
      - front
      - api
    ports:
      - "80:80"
      - "443:443"  # Para SSL futuro
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      # Para SSL:
      # - ./ssl:/etc/nginx/ssl
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge