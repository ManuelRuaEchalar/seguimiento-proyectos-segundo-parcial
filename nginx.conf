client_max_body_size 100M;
proxy_connect_timeout 60s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

server {
    listen 80;
    server_name seguimiento-de-proyectos-usfx.duckdns.org;

    # Redirigir HTTP a HTTPS excepto ruta de verificación
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name seguimiento-de-proyectos-usfx.duckdns.org;

    # Certificados SSL
    ssl_certificate /etc/letsencrypt/live/seguimiento-de-proyectos-usfx.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seguimiento-de-proyectos-usfx.duckdns.org/privkey.pem;

    # Configuración SSL moderna
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location ~ /\. { deny all; }
    location ~* (node_modules|package\.json|\.env) { deny all; }

    # ARCHIVOS ESTÁTICOS
    location /uploads/ {
        alias /app/public/uploads/;
        expires 1h;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
    }

    # API - SIN CACHE
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
    }

    location / {
        proxy_pass http://front:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}